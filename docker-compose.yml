version: '3.8'

services:

  # Base de datos PostgreSQL
  db:
    image: postgres:15
    container_name: flytrack-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: flytrack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # FlyTrack (Backend Spring Boot + Frontend React)
  flytrack-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flytrack-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/flytrack
      DB_USERNAME: postgres
      DB_PASSWORD: 1234
      JWT_SECRET: flytrack_prod_secret_key_change_this_in_production_min_32_chars
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
