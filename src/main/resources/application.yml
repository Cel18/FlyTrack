spring:
  application:
    name: flytrack-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/flytrack_db?allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:flytrack_dev_secret_key_change_in_production_min_32_chars}
  expiration: 900000
  refresh-expiration: 604800000
