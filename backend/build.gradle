plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'org.sonarqube' version '5.0.0.4638'
    id 'jacoco'
}

group = 'com.flytrack'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot starters
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // OpenAPI / Swagger UI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'

    // MySQL Driver
    runtimeOnly 'org.postgresql:postgresql'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'com.h2database:h2'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
    }
}

sonarqube {
    properties {
        property 'sonar.projectKey', 'Cel18_FlyTrack'
        property 'sonar.organization', 'cel18'
        property 'sonar.sources', 'src/main/java'
        property 'sonar.tests', 'src/test/java'
        property 'sonar.coverage.jacoco.xmlReportPaths', "${project.buildDir}/reports/jacoco/test/jacocoTestReport.xml"
    }
}

springBoot {
    mainClass = 'com.flytrack.back.FlyTrackApplication'
}

// ─────────────────────────────────────────────────────────────────────────────
// Monolito: copia el build del frontend React a los recursos estáticos
// del backend para que Spring Boot los sirva directamente.
//
// Vite (React) genera: frontend/dist/
//
// Spring Boot sirve estáticos desde: classpath:/static/
// ─────────────────────────────────────────────────────────────────────────────
def frontendBrowserDir = project(':frontend').file('dist')
def staticDir = layout.projectDirectory.dir('src/main/resources/static')

tasks.register('copyFrontendBuild', Copy) {
    description = 'Copia el build de producción del frontend Angular a los recursos estáticos del backend'
    group = 'build'

    dependsOn ':frontend:buildFrontend'

    from frontendBrowserDir
    into staticDir

    doFirst {
        // Limpia antes de copiar para evitar archivos residuales de builds anteriores
        delete staticDir
    }
}

// processResources del backend espera a que el frontend esté compilado y copiado
processResources.dependsOn('copyFrontendBuild')
